<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for AWS Lambda.

  The Lambda Node runtime ships no fonts at all. Without this, sharp renders
  the meme backgrounds and shapes correctly and draws no text whatsoever, and
  it does not warn you about it.

  FONTCONFIG_PATH points at this directory (see infra/template.yaml), and
  this file tells fontconfig that the .ttf files sitting next to it are the
  fonts it should use.
-->
<fontconfig>
  <!-- The bundled fonts live in this same directory. -->
  <dir>/var/task/assets/fonts</dir>

  <!-- Somewhere writable, because fontconfig insists on a cache directory. -->
  <cachedir>/tmp/fontconfig</cachedir>

  <!-- The layouts ask for these names, so map them onto what we bundled. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
